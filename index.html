<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa by NPSN</title>
<style>
:root{
  --bg:#03070a;--card-bg:#0a0f14;--text:#00ff88;--text-muted:#0fb879;--border:#00ff88;
  --input-bg:#050a0e;--hover-bg:#0d1a1f;--th-bg:#081116;--btn-bg:#00ff88;--btn-text:#03070a;
  --btn-hover:#00cc6a;--btn-secondary-bg:#0a1c18;--btn-secondary-text:#00ff88;
  --btn-secondary-hover:#0f2a22;--error:#ff5555;--shadow:0 0 10px rgba(0,255,136,.15);--accent-cyan:#00ffff;
}
body.dark-mode{
  --bg:#03070a;--card-bg:#0a0f14;--text:#00ff88;--text-muted:#0fb879;--border:#00ff88;
  --input-bg:#050a0e;--hover-bg:#0d1a1f;--th-bg:#081116;--btn-bg:#00ff88;--btn-text:#03070a;
  --btn-hover:#00cc6a;--btn-secondary-bg:#0a1c18;--btn-secondary-text:#00ff88;
  --btn-secondary-hover:#0f2a22;--error:#ff5555;--shadow:0 0 10px rgba(0,255,136,.15);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px 16px;transition:background .3s,color .3s;min-height:100vh;display:flex;flex-direction:column;font-size:14px;text-shadow:0 0 4px rgba(0,255,136,.4)}
.container{max-width:1000px;margin:0 auto;width:100%;flex:1}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow),inset 0 0 15px rgba(0,255,136,.05);padding:24px;margin-bottom:24px;transition:background .3s,border-color .3s}
.header-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.5px;text-transform:uppercase}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;background:var(--btn-secondary-bg);border:1px solid var(--border);color:var(--btn-secondary-text);padding:8px;border-radius:8px;cursor:pointer;transition:all .2s}
.theme-toggle:hover{background:var(--btn-secondary-hover);box-shadow:0 0 8px var(--border)}
.theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.input-group{display:flex;gap:10px;margin-bottom:16px}
input[type="text"]{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--input-bg);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;font-family:monospace}
input[type="text"]:focus{border-color:var(--accent-cyan);box-shadow:0 0 8px var(--accent-cyan)}
input[type="text"]::placeholder{color:var(--text-muted);opacity:0.7}
button.btn-primary{padding:12px 20px;background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--btn-bg);border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
button.btn-primary:hover{background:var(--btn-hover);border-color:var(--btn-hover);box-shadow:0 0 12px var(--btn-hover)}
button.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.info-box{background:var(--hover-bg);padding:16px;border-radius:8px;font-size:13px;margin-bottom:20px;line-height:1.6;border:1px solid var(--border);box-shadow:inset 0 0 10px rgba(0,255,136,.05)}
.info-box strong{font-weight:600;color:var(--accent-cyan);text-shadow:0 0 5px var(--accent-cyan)}
.table-wrap{max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid rgba(0,255,136,.2)}
th{background:var(--th-bg);font-weight:700;color:var(--accent-cyan);position:sticky;top:0;z-index:10;text-transform:uppercase;font-size:11px;letter-spacing:1px;border-bottom:2px solid var(--accent-cyan)}
tr:last-child td{border-bottom:none}
tr:hover{background:var(--hover-bg);box-shadow:inset 0 0 15px rgba(0,255,136,.1)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12px;font-weight:600;border-radius:6px;border:1px solid var(--border);background:var(--btn-secondary-bg);color:var(--btn-secondary-text);cursor:pointer;transition:all .2s}
.btn-sm:hover{background:var(--btn-secondary-hover);box-shadow:0 0 8px var(--border)}
.btn-sm svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.search-box{margin-bottom:16px}
#status{font-size:13px;color:var(--error);min-height:18px;margin-top:8px}
#status.loading{color:var(--text-muted);display:flex;align-items:center;gap:8px}
#status.loading::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid rgba(0,255,136,.2);border-top-color:var(--accent-cyan);border-radius:50%;animation:spin .7s linear infinite}
#status.success{color:var(--accent-cyan);text-shadow:0 0 8px var(--accent-cyan)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.4);border-top-color:var(--btn-text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent-cyan);box-shadow:0 0 10px var(--accent-cyan);transition:width .3s ease,opacity .3s;z-index:9999}
#progress.active{width:70%}
#progress.done{width:100%;opacity:0}
#tableInfo{margin-top:12px;font-size:12px;color:var(--text-muted);text-align:right}
.footer{text-align:center;padding:24px 0;font-size:12px;color:var(--text-muted);border-top:1px solid rgba(0,255,136,.2);margin-top:40px}
.footer strong{color:var(--accent-cyan);font-weight:600;text-shadow:0 0 5px var(--accent-cyan)}
.dump-wrap{margin-top:16px;display:flex;flex-direction:column;gap:0}
.dump-item{border:1px solid rgba(0,255,136,.35);border-radius:0;background:var(--hover-bg);padding:10px 14px;box-shadow:inset 0 0 10px rgba(0,255,136,.05);transition:border-color .2s,box-shadow .2s}
.dump-item:first-child{border-top-left-radius:8px;border-top-right-radius:8px}
.dump-item:last-child{border-bottom-left-radius:8px;border-bottom-right-radius:8px}
.dump-item+.dump-item{border-top:none}
.dump-item:hover{border-color:var(--accent-cyan);box-shadow:0 0 10px rgba(0,255,255,.25),inset 0 0 10px rgba(0,255,136,.08);z-index:1}
.dump-item .dump-title{font-size:13px;font-weight:700;color:var(--accent-cyan);text-shadow:0 0 6px var(--accent-cyan);margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed rgba(0,255,136,.3);letter-spacing:.3px}
.dump-row{display:flex;flex-wrap:wrap;font-size:12.5px;padding:2px 0;border-bottom:1px dotted rgba(0,255,136,.15)}
.dump-row:last-child{border-bottom:none}
.dump-label{flex:0 0 160px;color:var(--text-muted);font-weight:600;text-transform:capitalize}
.dump-value{flex:1;color:var(--text);word-break:break-all;font-family:monospace}
.dump-empty{text-align:center;padding:24px;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>
<div id="progress"></div>
<div class="container">
  <div class="card">
    <div class="header-actions">
      <h1>Cari Data Siswa</h1>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle Theme">
        <svg id="icon-sun" class="hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
    <div class="input-group">
      <input type="text" id="npsnInput" placeholder="Masukkan NPSN (contoh: 20307641)" onkeypress="if(event.key==='Enter') cariData()">
      <button class="btn-primary" id="searchBtn" onclick="cariData()">Cari</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="resultCard" class="card hidden">
    <div class="flex-between" style="margin-bottom:20px;">
      <h1>Hasil Pencarian</h1>
      <div class="actions">
        <button class="btn-sm" onclick="downloadJSON()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          JSON
        </button>
        <button class="btn-sm" onclick="downloadCSV()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          CSV
        </button>
      </div>
    </div>
    <div id="sekolahInfo" class="info-box"></div>
    <h1 style="font-size:14px;margin:0 0 10px;">Detail Data Siswa (Dump)</h1>
    <div id="dumpResult" class="dump-wrap"></div>
    <div class="search-box" style="margin-top:20px;">
      <input type="text" id="filterInput" placeholder="Filter berdasarkan nama, NISN, atau NIK..." oninput="renderTable()">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>No</th><th>Nama</th><th>NISN</th><th>JK</th><th>Tgl Lahir</th><th>Rombel</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div id="tableInfo"></div>
  </div>
</div>

<footer class="footer">Powered by <strong>Maxyz</strong></footer>

<script>
const API_BASE = "https:\/\/api-baberkyu-vps-team-official.my.id";
const API_KEY = "yahh-maling-awoka-rinem-pula-najis";
const body = document.body;
const iconSun = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');
const currentTheme = localStorage.getItem('theme');
function setTheme(theme){
  if(theme==='dark'){body.classList.add('dark-mode');iconSun.classList.remove('hidden');iconMoon.classList.add('hidden');}
  else{body.classList.remove('dark-mode');iconSun.classList.add('hidden');iconMoon.classList.remove('hidden');}
}
if(currentTheme==='dark') setTheme('dark'); else setTheme('light');
function toggleTheme(){
  if(body.classList.contains('dark-mode')){localStorage.setItem('theme','light');setTheme('light');}
  else{localStorage.setItem('theme','dark');setTheme('dark');}
}
let rawData = [];
let sekolahData = {};
async function cariData(){
  const npsn = document.getElementById('npsnInput').value.trim();
  const btn = document.getElementById('searchBtn');
  const status = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const progress = document.getElementById('progress');
  if(!npsn){
    status.className='';
    status.textContent='NPSN tidak boleh kosong.';
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Mencari...';
  status.className = 'loading';
  status.textContent = 'Menghubungi server, memuat data siswa...';
  resultCard.classList.add('hidden');
  progress.className = 'active';
  const endpoint = `${API_BASE}/api/siswa?npsn=${encodeURIComponent(npsn)}`;
  const mulai = performance.now();
  try{
    const res = await fetch(endpoint, {
      method:'GET',
      headers:{'Accept':'application/json','X-API-Key':API_KEY},
      mode:'cors',
      cache:'no-store'
    });
    const data = await res.json();
    if(!res.ok || data.status==='error'){
      throw new Error(data.pesan || data.kode || 'Gagal mengambil data');
    }
    sekolahData = data.sekolah || {};
    rawData = data.data || data.siswa || [];
    document.getElementById('sekolahInfo').innerHTML = `
      <strong>${sekolahData.nama || '-'}</strong><br>
      NPSN: ${data.npsn || sekolahData.npsn || npsn} &bull;
      ${sekolahData.kabupaten_kota || '-'} &bull;
      ${sekolahData.propinsi || '-'}<br>
      Total Siswa: <strong>${rawData.length}</strong>
    `;
    renderDump();
    const durasi = ((performance.now() - mulai) / 1000).toFixed(1);
    status.className = 'success';
    status.textContent = `Berhasil memuat ${rawData.length} siswa dalam ${durasi} detik.`;
    resultCard.classList.remove('hidden');
    renderTable();
  }catch(err){
    status.className = '';
    status.textContent = err.message;
  }finally{
    btn.disabled = false;
    btn.textContent = 'Cari';
    progress.className = 'done';
    setTimeout(() => { progress.className = ''; }, 500);
  }
}
function renderDump(){
  const wrap = document.getElementById('dumpResult');
  wrap.innerHTML = '';
  if(rawData.length === 0){
    wrap.innerHTML = '<div class="dump-empty">Tidak ada data siswa untuk ditampilkan.</div>';
    return;
  }
  const fields = [
    'nama','jenis_kelamin','tanggal_lahir','nama_ibu_kandung','nik','nisn',
    'last_update','rombel','tingkat','peserta_didik_id','rombongan_belajar_id'
  ];
  rawData.forEach((s, idx) => {
    const item = document.createElement('div');
    item.className = 'dump-item';
    const title = document.createElement('div');
    title.className = 'dump-title';
    title.textContent = `${idx + 1}. ${s.nama || '(Tanpa Nama)'}`;
    item.appendChild(title);
    fields.forEach(f => {
      const row = document.createElement('div');
      row.className = 'dump-row';
      const label = document.createElement('div');
      label.className = 'dump-label';
      label.textContent = f;
      const value = document.createElement('div');
      value.className = 'dump-value';
      value.textContent = (s[f] !== undefined && s[f] !== null && s[f] !== '') ? s[f] : '-';
      row.appendChild(label);
      row.appendChild(value);
      item.appendChild(row);
    });
    wrap.appendChild(item);
  });
}
function renderTable(){
  const filter = document.getElementById('filterInput').value.toLowerCase();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const filtered = rawData.filter(s => {
    if(!filter) return true;
    return (s.nama && s.nama.toLowerCase().includes(filter)) ||
           (s.nisn && String(s.nisn).includes(filter)) ||
           (s.nik && String(s.nik).includes(filter));
  });
  if(filtered.length===0){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted);">Tidak ada data yang cocok.</td></tr>';
  }else{
    filtered.forEach((s,i)=>{
      tbody.innerHTML += `
        <tr>
          <td>${i+1}</td>
          <td>${s.nama || '-'}</td>
          <td>${s.nisn || '-'}</td>
          <td>${s.jenis_kelamin || '-'}</td>
          <td>${s.tanggal_lahir || '-'}</td>
          <td>${s.rombel || '-'}</td>
        </tr>`;
    });
  }
  document.getElementById('tableInfo').textContent = `Menampilkan ${filtered.length} dari ${rawData.length} siswa.`;
}
function downloadJSON(){
  if(rawData.length===0) return;
  const blob = new Blob([JSON.stringify({sekolah:sekolahData,siswa:rawData},null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `data_siswa_${sekolahData.npsn || 'unknown'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function downloadCSV(){
  if(rawData.length===0) return;
  const headers = ['Nama','NISN','NIK','JK','Tgl Lahir','Rombel','Nama Ibu'];
  const rows = rawData.map(s => [
    `"${s.nama || ''}"`,
    `"${s.nisn || ''}"`,
    `"${s.nik || ''}"`,
    `"${s.jenis_kelamin || ''}"`,
    `"${s.tanggal_lahir || ''}"`,
    `"${s.rombel || ''}"`,
    `"${s.nama_ibu_kandung || ''}"`
  ]);
  const csvContent = [headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob([csvContent],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `data_siswa_${sekolahData.npsn || 'unknown'}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("keydown", function(e){
  var k = e.keyCode || e.which;
  if(k===123){e.preventDefault();return false;}
  if(e.ctrlKey && e.shiftKey && (k===73||k===74||k===67)){e.preventDefault();return false;}
  if(e.ctrlKey && !e.shiftKey && k===85){e.preventDefault();return false;}
}, true);
</script>
</body>
</html>
